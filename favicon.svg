<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Orange Squircle Body matching Grade Calculator & Reviewer Banner -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bodyGrad)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Book Cover Base (Blue Spine & Bottom) -->
  <path d="M11 41 C19 44, 29 43, 32 45 C35 43, 45 44, 53 41 C55 41, 56 42.5, 56 44 C56 46, 45 50, 32 48.5 C19 50, 8 46, 8 44 C8 42.5, 9 41, 11 41 Z" fill="#0369a1"/>
  <path d="M10 39 C19 42, 29 41.5, 32 43 C35 41.5, 45 42, 54 39 C55 39, 56 40.5, 56 42 C56 44, 45 47.5, 32 46 C19 47.5, 8 44, 8 42 C8 40.5, 9 39, 10 39 Z" fill="url(#cGrad)"/>
  
  <!-- Left Pages Block -->
  <path d="M10 18 C19 14.5, 29 15.5, 32 19 L32 43 C29 39.5, 19 38.5, 10 42 Z" fill="url(#pLeft)"/>
  
  <!-- Right Pages Block -->
  <path d="M54 18 C45 14.5, 35 15.5, 32 19 L32 43 C35 39.5, 45 38.5, 54 42 Z" fill="url(#pRight)"/>
  
  <!-- Spine Center Crease -->
  <path d="M31.3 18.5 L31.3 43.5 C31.7 43.2, 32.3 43.2, 32.7 43.5 L32.7 18.5 Z" fill="#94a3b8" opacity="0.6"/>
  
  <!-- Subtle Lines on Left Page -->
  <path d="M15 24 C21 22, 26 22.5, 29 24" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M15 29 C21 27, 26 27.5, 29 29" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M15 34 C21 32, 26 32.5, 29 34" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Subtle Lines on Right Page -->
  <path d="M35 24 C38 22.5, 43 22, 49 24" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M35 29 C38 27.5, 43 27, 49 29" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M35 34 C38 32.5, 43 32, 49 34" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" fill="none"/>
</svg>
