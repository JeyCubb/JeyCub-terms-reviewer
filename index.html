<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JeyCub Terms Reviewer</title>
  <meta name="description" content="Interactive quiz reviewer app for Engineering Board Exams: Fluid Mechanics, Mechanics of Deformable Bodies, and Heat Transfer.">
  <!-- Quiz Emoji Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23f97316%22/><path d=%22M6 8h7a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H6z M26 8h-7a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h8z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=118.0">

  <!-- KaTeX for crisp mathematical formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- MathLive WYSIWYG Math Editor -->
  <script defer src="https://unpkg.com/mathlive"></script>

  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Immediate Early Font Scale Restoration (Prevents Reset on Refresh) -->
  <script>
    (function() {
      try {
        var s = localStorage.getItem('jt_font_scale');
        if (s) {
          var val = parseFloat(s);
          if (!isNaN(val) && val >= 0.75 && val <= 2.0) {
            document.documentElement.style.setProperty('--font-scale', val);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-mode="practice">

  <!-- Main Container -->
  <main class="main-container">

    <!-- ============================================================
         CONTENT AREA (Question / Formulas / All-Questions views)
         Comes FIRST so question is at the very top of the page
    ============================================================ -->

    <!-- MODE 1: PRACTICE MODE (Question FIRST at Top) -->
    <section id="practice-view" class="view-section active">
      
      <!-- Question Card -->
      <div class="quiz-card">
        <!-- Question Body -->
        <div class="question-content">
          <div class="question-header-bar">
            <span class="question-pill-badge" id="q-pill-badge"><i class="fa-solid fa-graduation-cap"></i> Practice</span>
            <button type="button" class="q-audio-btn" id="q-audio-btn" onclick="toggleNarration()" title="Narrate question &amp; choices [Press M]">
              <i class="fa-solid fa-volume-high" id="q-audio-icon"></i> <span id="q-audio-label">Listen</span>
            </button>
          </div>
          <h2 class="question-text" id="q-text">Loading question...</h2>
          
          <!-- Optional Question Diagram Image Container -->
          <div id="q-image-container" class="question-image-container" style="display: none;"></div>
          
          <!-- Choices / Options list -->
          <div class="options-grid" id="q-options-container">
            <!-- Options dynamically rendered in JS -->
          </div>
        </div>

        <!-- Previous & Next Navigation Buttons (Just below the question!) -->
        <div class="inline-nav-container">
          <button class="quiz-nav-btn" onclick="prevQuestion()" id="btn-prev-inline">
            <i class="fa-solid fa-arrow-left"></i> Previous
          </button>
          <button class="quiz-nav-btn primary" onclick="nextQuestion()" id="btn-next-inline">
            Next <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Toggle Button for Question Hints & Solution -->
      <div class="notes-toggle-wrapper">
        <button class="notes-toggle-btn" id="toggle-notes-btn" onclick="toggleNotesSection()">
          <i class="fa-solid fa-lightbulb"></i> Show Hints (<span id="notes-count-badge">0</span>)
          <i class="fa-solid fa-chevron-down" id="toggle-notes-chevron"></i>
        </button>
      </div>

      <!-- Collapsible Per-Question Notes & Solution Section -->
      <!-- Interactive Notes & Hints Drawer -->
      <div id="notes-section-container" class="interactive-drawer hidden">
        <!-- Concept Hint Box -->
        <div class="explanation-box" id="q-explanation-box">
          <div class="explanation-box-top-row">
            <div class="explanation-header" id="q-explanation-header"><i class="fa-solid fa-lightbulb"></i> Hint & Concept:</div>
            <button class="hide-hints-top-btn" onclick="hideNotesSection()" title="Hide Hints (Press Space)">
              <i class="fa-solid fa-xmark"></i> Hide Hints
            </button>
          </div>
          <div class="explanation-text" id="q-explanation-text"></div>
        </div>

        <div class="notes-section-header">
          <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            <h3><i class="fa-solid fa-pen-to-square"></i> Notes & Discussion</h3>
            <span class="notes-sub-info"><span id="notes-q-num">1</span>.)</span>
          </div>
        </div>

        <!-- Posted Notes List First at the Top -->
        <div class="comments-list" id="live-notes-container" style="margin-bottom: 1.5rem;">
          <!-- Rendered dynamically per question -->
        </div>

        <!-- Post Shared Note Form -->
        <div class="add-comment-form">
          <input type="text" id="live-name-input" placeholder="Your Name (Optional)" maxlength="40">
          <textarea id="live-text-input" placeholder="Add a study tip, formula, or layman explanation for this question..." maxlength="500"></textarea>
          <button class="comment-submit-btn" onclick="postLiveSharedNote()"><i class="fa-solid fa-paper-plane"></i> Post Note</button>
        </div>
      </div>

      <!-- Practice Controls Box (Moved BELOW Show Notes & Solution) -->
      <div class="quiz-controls-card">
        <div class="question-number-badge">
          <span id="subject-badge-name">Fluid Mechanics</span> • Problem <span id="q-current-num">1</span> of <span id="q-total-num">127</span>
        </div>

        <div class="quiz-header-controls">
          <!-- Jump to Question Number Input (To the left of Pool selector) -->
          <div class="jump-input-wrapper">
            <label for="jump-number-input"><i class="fa-solid fa-hashtag"></i> Jump:</label>
            <input type="number" id="jump-number-input" placeholder="No." min="1" max="500" onkeydown="handleJumpInputKey(event)">
            <button class="jump-go-btn" onclick="executeJumpFromInput()" title="Jump to Problem"><i class="fa-solid fa-arrow-right"></i></button>
          </div>

          <!-- Practice Pool Filter Dropdown -->
          <div class="practice-filter-wrapper">
            <label for="practice-filter-select"><i class="fa-solid fa-layer-group"></i> Pool:</label>
            <select id="practice-filter-select" onchange="changePracticeFilter(this.value)">
              <option value="all">📚 All Questions</option>
              <option value="weak">⚠️ Weak Questions</option>
                          </select>
          </div>

          <!-- Random Toggle Button -->
          <button class="control-toggle-btn" id="btn-toggle-random" onclick="toggleRandomMode()" title="Toggle Random Order">
            <i class="fa-solid fa-shuffle"></i> Random: OFF
          </button>


        </div>
      </div>
    </section>

    <!-- MODE 2: ALL QUESTIONS / FLASHCARDS VIEW -->
    <section id="all-view" class="view-section">
      <div class="filter-controls-card">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-all-input" placeholder="Search by question keyword, concept, or option..." oninput="filterAllQuestions()">
        </div>
        <div class="filters-row">
          <select id="filter-status-select" onchange="filterAllQuestions()">
            <option value="all">All Statuses</option>
            <option value="weak">⚠️ Class Weak Questions</option>
                        <option value="correct">✓ Correctly Answered</option>
            <option value="incorrect">✗ Incorrectly Answered</option>
          </select>
          <span class="search-count-label" id="search-count-badge">Showing questions</span>
        </div>
      </div>

      <div class="questions-list-container" id="all-questions-list">
        <!-- Rendered in JS -->
      </div>
    </section>

    

    <!-- Reset All Answers Button -->
    <div class="reset-progress-wrapper">
      <button class="reset-all-btn" onclick="resetAllSubjectAnswers()" title="Reset answered practice questions for current subject">
        <i class="fa-solid fa-rotate-left"></i> Reset All Answers for <span id="reset-subject-name">Fluid Mechanics</span> (Keeps Weak Questions Memory)
      </button>
    </div>

    <!-- ============================================================
         BOTTOM PANEL: Stats Bar + Header (brand, subject, mode nav)
         Sits BELOW all content — sticky to the bottom on mobile
    ============================================================ -->
    <div class="bottom-panel">

      <!-- Progress & Analytics Bar -->
      <section class="stats-bar-three">
        <!-- Box 1: Total Problems & Starred -->
        <div class="stat-card-group">
          <div class="stat-group-header">
            <i class="fa-solid fa-layer-group stat-group-icon blue"></i>
            <span class="stat-group-title">Overview</span>
          </div>
          <div class="stat-group-body">
            <div class="stat-sub-item">
              <span class="stat-value" id="stat-total">93</span>
              <span class="stat-label">Total</span>
            </div>
            <div class="stat-sub-divider"></div>
            <div class="stat-sub-item">
              <span class="stat-value orange-text" id="stat-accuracy">0%</span>
              <span class="stat-label">Accuracy</span>
            </div>
          </div>
        </div>

        <!-- Box 2: Correct & Incorrect -->
        <div class="stat-card-group">
          <div class="stat-group-header">
            <i class="fa-solid fa-square-poll-vertical stat-group-icon green"></i>
            <span class="stat-group-title">Score</span>
          </div>
          <div class="stat-group-body">
            <div class="stat-sub-item">
              <span class="stat-value green-text" id="stat-correct">0</span>
              <span class="stat-label">Correct</span>
            </div>
            <div class="stat-sub-divider"></div>
            <div class="stat-sub-item">
              <span class="stat-value red-text" id="stat-incorrect">0</span>
              <span class="stat-label">Wrong</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Title & Subject Navigation Bar -->
      <header class="app-header">
        <div class="header-container">
          
          <!-- Brand & Theme Toggle -->
          <div class="brand-row">
            <div class="brand">
              <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
              </div>
              <a href="https://jeycubb.github.io/TIP-Grade-Calculator/" target="_self" class="reviewer-link-icon grade-calc-link-icon" title="Open TIP Grade Calculator (GWA & Target Calculator)" aria-label="Open TIP Grade Calculator">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="2" width="16" height="20" rx="2"/>
                  <line x1="8" y1="6" x2="16" y2="6"/>
                  <line x1="16" y1="14" x2="16" y2="18"/>
                  <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/>
                </svg>
              </a>
              <div class="brand-text">
                <h1><span>JeyCub</span> Terms Reviewer</h1>
              </div>
            </div>

            <div class="header-actions">
                            <button class="action-btn font-toggle-btn" onclick="cycleFontSize()" title="Text Size: Tap to make text larger for easier reading">
                <span class="aa-icon">A<span class="aa-sub">A</span></span>
                <span id="header-font-badge" class="header-font-badge">100%</span>
              </button>
              <button class="action-btn pdf-btn" title="Download Subject as Printable PDF (Randomized, 2 Columns, 0.05 margin)" onclick="downloadSubjectPdf()">
                <i class="fa-solid fa-file-pdf"></i>
              </button>
              <button class="action-btn theme-toggle" title="Toggle Dark/Light Mode" onclick="toggleTheme()">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
              </button>
            </div>
          </div>

          <!-- Subject Selector Dropdown -->
          <div class="subject-dropdown-wrapper">
            <label for="subject-selector"><i class="fa-solid fa-book-open"></i> Subject:</label>
            <select id="subject-selector" onchange="switchSubject(this.value)">
              <option value="basic_electronics" selected>Basic Electronics</option>
              <option value="fluid_mechanics">Fluid Mechanics</option>
              <option value="deformable_bodies">Mechanics of Deformable Bodies</option>
              <option value="heat_transfer">Heat Transfer</option>
              <option value="ac_dc_machinery">AC/DC Machinery</option>
            </select>
          </div>

          <!-- Review Modes Toggle -->
          <nav class="mode-nav">
            <button class="nav-btn active" id="btn-practice-mode" onclick="switchMode('practice')">
              <i class="fa-solid fa-graduation-cap"></i> Practice
            </button>

            <button class="nav-btn" id="btn-all-mode" onclick="switchMode('all')">
              <i class="fa-solid fa-list-check"></i> All Questions
            </button>
          </nav>
        </div>
      </header>

    </div><!-- /.bottom-panel -->

  </main>
  <!-- Floating Font Size Indicator Toast (Tap to reset to 100%) -->
    <!-- Floating Font Size Control Toast (Accessible Text Sizing) -->
  <div id="font-scale-toast" class="font-scale-toast" title="Text Size Controls">
    <button type="button" class="toast-adjust-btn" onclick="adjustFontSize(-0.05); event.stopPropagation();" title="Smaller (A-)"><i class="fa-solid fa-minus"></i></button>
    <div class="toast-center-content" onclick="resetFontScale()" title="Tap to reset to 100%">
      <i class="fa-solid fa-text-height"></i> Text: <span id="font-scale-val">100%</span>
    </div>
    <button type="button" class="toast-adjust-btn" onclick="adjustFontSize(0.05); event.stopPropagation();" title="Larger (A+)"><i class="fa-solid fa-plus"></i></button>
  </div>


  <script src="questions.js?v=110.0"></script>
  <script src="app.js?v=110.0"></script>
  <!-- App Confirmation & Alert Modal (TIP Grade Calculator Design) -->
  <div id="app-confirm-modal" class="profile-modal-overlay" style="display: none;">
    <div class="profile-modal-dialog">
      <div class="profile-modal-header">
        <div class="profile-modal-title-wrap">
          <div class="profile-modal-avatar-icon" id="app-confirm-modal-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div>
            <h2 class="profile-modal-title" id="app-confirm-modal-title">Confirm Action</h2>
            <div class="profile-modal-subtitle" id="app-confirm-modal-subtitle" style="display: none;"></div>
          </div>
        </div>
        <button class="profile-modal-close-btn" id="app-confirm-modal-close" title="Close dialog">&times;</button>
      </div>

      <div class="profile-modal-body" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.35rem;">
        <div id="app-confirm-modal-content"></div>

        <div id="app-confirm-modal-actions" style="display: flex; gap: 0.55rem; margin-top: 0.35rem;">
          <button class="btn-modal btn-modal-cancel" id="app-confirm-modal-cancel">
            Cancel
          </button>
          <button class="btn-modal btn-modal-primary" id="app-confirm-modal-confirm">
            Confirm
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
