<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JeyCub Terms Reviewer</title>
  <meta name="description" content="Interactive quiz reviewer app for Engineering Board Exams: Fluid Mechanics, Mechanics of Deformable Bodies, and Heat Transfer.">
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=28.0">

  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body data-mode="practice">

  <!-- Main Container -->
  <main class="main-container">

    <!-- MODE 1: PRACTICE MODE (Question FIRST at Top) -->
    <section id="practice-view" class="view-section active">
      
      <!-- Question Card -->
      <div class="quiz-card">
        <!-- Question Body -->
        <div class="question-content">
          <h2 class="question-text" id="q-text">Loading question...</h2>
          
          <!-- Choices / Options list -->
          <div class="options-grid" id="q-options-container">
            <!-- Options dynamically rendered in JS -->
          </div>
        </div>

        <!-- Previous & Next Navigation Buttons (Just below the question!) -->
        <div class="inline-nav-container">
          <button class="quiz-nav-btn" onclick="prevQuestion()">
            <i class="fa-solid fa-arrow-left"></i> Previous
          </button>
          <button class="quiz-nav-btn primary" onclick="nextQuestion()">
            Next <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Toggle Button for Question Hints & Solution -->
      <div class="notes-toggle-wrapper">
        <button class="notes-toggle-btn" id="toggle-notes-btn" onclick="toggleNotesSection()">
          <i class="fa-solid fa-lightbulb"></i> Show Hints (<span id="notes-count-badge">0</span>)
          <i class="fa-solid fa-chevron-down" id="toggle-notes-chevron"></i>
        </button>
      </div>

      <!-- Collapsible Per-Question Notes & Solution Section -->
      <div class="interactive-drawer hidden" id="notes-section-container">
        <!-- Solution & Explanation -->
        <div class="explanation-box" id="q-explanation-box">
          <div class="explanation-header">
            <i class="fa-solid fa-lightbulb"></i> Layman's Hint & Key Concept
          </div>
          <p class="explanation-text" id="q-explanation-text"></p>
        </div>

        <div class="notes-section-header">
          <h3><i class="fa-solid fa-pen-to-square"></i> Notes & Discussion</h3>
          <span class="notes-sub-info">Problem #<span id="notes-q-num">1</span></span>
        </div>

        <!-- Posted Notes List First at the Top -->
        <div class="comments-list" id="live-notes-container" style="margin-bottom: 1.5rem;">
          <!-- Rendered dynamically per question -->
        </div>

        <!-- Post Shared Note Form -->
        <div class="add-comment-form">
          <input type="text" id="live-name-input" placeholder="Your Name (Optional)" maxlength="40">
          <textarea id="live-text-input" placeholder="Add a study tip, formula, or layman explanation for this question..." maxlength="500"></textarea>
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 0.5rem;">
            <span style="font-size: 0.78rem; color: var(--text-muted);"><i class="fa-solid fa-keyboard"></i> Press <b>[Enter]</b> to post • <b>[Shift + Enter]</b> for new line</span>
            <button class="comment-submit-btn" onclick="postLiveSharedNote()"><i class="fa-solid fa-paper-plane"></i> Post Note</button>
          </div>
        </div>
      </div>

      <!-- Practice Controls Box (Moved BELOW Show Notes & Solution) -->
      <div class="quiz-controls-card">
        <div class="question-number-badge">
          <span id="subject-badge-name">Fluid Mechanics</span> • Problem <span id="q-current-num">1</span> of <span id="q-total-num">127</span>
        </div>

        <div class="quiz-header-controls">
          <!-- Jump to Question Number Input (To the left of Pool selector) -->
          <div class="jump-input-wrapper">
            <label for="jump-number-input"><i class="fa-solid fa-hashtag"></i> Jump:</label>
            <input type="number" id="jump-number-input" placeholder="No." min="1" max="500" onkeydown="handleJumpInputKey(event)">
            <button class="jump-go-btn" onclick="executeJumpFromInput()" title="Jump to Problem"><i class="fa-solid fa-arrow-right"></i></button>
          </div>

          <!-- Practice Pool Filter Dropdown -->
          <div class="practice-filter-wrapper">
            <label for="practice-filter-select"><i class="fa-solid fa-layer-group"></i> Pool:</label>
            <select id="practice-filter-select" onchange="changePracticeFilter(this.value)">
              <option value="all">📚 All Questions</option>
              <option value="weak">⚠️ Weak Questions</option>
              <option value="bookmarked">⭐ Bookmarked</option>
            </select>
          </div>

          <!-- Random Toggle Button -->
          <button class="control-toggle-btn" id="btn-toggle-random" onclick="toggleRandomMode()" title="Toggle Random Order">
            <i class="fa-solid fa-shuffle"></i> Random: OFF
          </button>

          <!-- Bookmark Button -->
          <button class="bookmark-btn" id="q-bookmark-btn" onclick="toggleBookmarkCurrent()" title="Bookmark question">
            <i class="fa-regular fa-star" id="bookmark-icon"></i> Bookmark
          </button>
        </div>
      </div>
    </section>

    <!-- MODE 2: ALL QUESTIONS / FLASHCARDS VIEW -->
    <section id="all-view" class="view-section">
      <div class="filter-controls-card">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-all-input" placeholder="Search by question keyword, concept, or option..." oninput="filterAllQuestions()">
        </div>
        <div class="filters-row">
          <select id="filter-status-select" onchange="filterAllQuestions()">
            <option value="all">All Statuses</option>
            <option value="weak">⚠️ Class Weak Questions</option>
            <option value="bookmarked">⭐ Bookmarked Only</option>
            <option value="correct">✓ Correctly Answered</option>
            <option value="incorrect">✗ Incorrectly Answered</option>
          </select>
          <span class="search-count-label" id="search-count-badge">Showing questions</span>
        </div>
      </div>

      <div class="questions-list-container" id="all-questions-list">
        <!-- Rendered in JS -->
      </div>
    </section>

    <!-- Title & Subject Navigation Bar -->
    <header class="app-header">
      <div class="header-container">
        
        <!-- Brand & Theme Toggle -->
        <div class="brand-row">
          <div class="brand">
            <div class="brand-icon">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="brand-text">
              <h1><span>JeyCub</span> Terms Reviewer</h1>
            </div>
          </div>

          <div class="header-actions">
            <button class="action-btn theme-toggle" title="Toggle Dark/Light Mode" onclick="toggleTheme()">
              <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
          </div>
        </div>

        <!-- Subject Selector Dropdown -->
        <div class="subject-dropdown-wrapper">
          <label for="subject-selector"><i class="fa-solid fa-book-open"></i> Subject:</label>
          <select id="subject-selector" onchange="switchSubject(this.value)">
            <option value="fluid_mechanics">Fluid Mechanics</option>
            <option value="deformable_bodies">Mechanics of Deformable Bodies</option>
            <option value="heat_transfer">Heat Transfer</option>
          </select>
        </div>

        <!-- Review Modes Toggle -->
        <nav class="mode-nav">
          <button class="nav-btn active" id="btn-practice-mode" onclick="switchMode('practice')">
            <i class="fa-solid fa-graduation-cap"></i> Practice
          </button>
          <button class="nav-btn" id="btn-all-mode" onclick="switchMode('all')">
            <i class="fa-solid fa-list-check"></i> All Questions
          </button>
        </nav>
      </div>
    </header>

    <!-- Progress & Analytics Bar -->
    <section class="stats-bar-three">
      <!-- Box 1: Total Problems & Starred -->
      <div class="stat-card-group">
        <div class="stat-group-header">
          <i class="fa-solid fa-layer-group stat-group-icon blue"></i>
          <span class="stat-group-title">Overview</span>
        </div>
        <div class="stat-group-body">
          <div class="stat-sub-item">
            <span class="stat-value" id="stat-total">127</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-sub-divider"></div>
          <div class="stat-sub-item">
            <span class="stat-value gold-text" id="stat-bookmarks">0</span>
            <span class="stat-label">Starred</span>
          </div>
        </div>
      </div>

      <!-- Box 2: Correct & Incorrect -->
      <div class="stat-card-group">
        <div class="stat-group-header">
          <i class="fa-solid fa-square-poll-vertical stat-group-icon green"></i>
          <span class="stat-group-title">Score</span>
        </div>
        <div class="stat-group-body">
          <div class="stat-sub-item">
            <span class="stat-value green-text" id="stat-correct">0</span>
            <span class="stat-label">Correct</span>
          </div>
          <div class="stat-sub-divider"></div>
          <div class="stat-sub-item">
            <span class="stat-value red-text" id="stat-incorrect">0</span>
            <span class="stat-label">Wrong</span>
          </div>
        </div>
      </div>

      <!-- Box 3: Accuracy -->
      <div class="stat-card-group">
        <div class="stat-group-header">
          <i class="fa-solid fa-chart-line stat-group-icon purple"></i>
          <span class="stat-group-title">Mastery</span>
        </div>
        <div class="stat-group-body single">
          <div class="stat-sub-item center">
            <span class="stat-value purple-text" id="stat-accuracy">0%</span>
            <span class="stat-label">Accuracy</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Reset All Answers Button at the Very Bottom -->
    <div class="reset-progress-wrapper">
      <button class="reset-all-btn" onclick="resetAllSubjectAnswers()" title="Reset answered practice questions for current subject">
        <i class="fa-solid fa-rotate-left"></i> Reset All Answers for <span id="reset-subject-name">Fluid Mechanics</span> (Keeps Weak Questions Memory)
      </button>
    </div>

  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
