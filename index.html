<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JeyCub Terms Reviewer</title>
  <meta name="description" content="Interactive quiz reviewer app for Engineering Board Exams: Fluid Mechanics, Mechanics of Deformable Bodies, and Heat Transfer.">
  <!-- Reviewer Book Favicon (Orange Squircle Vector matching Banner & Grade Calculator style) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1.0">
  <link rel="alternate icon" href="favicon.svg?v=1.0">
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=179.0">

  <!-- KaTeX for crisp mathematical formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- MathLive WYSIWYG Math Editor -->
  <script defer src="https://unpkg.com/mathlive"></script>

  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Immediate Early Font Scale Restoration (Prevents Reset on Refresh) -->
  <script>
    (function() {
      try {
        var s = localStorage.getItem('jt_font_scale');
        // If not set or previously set to older defaults, update to new default 1.75 (175%)
        if (!s || s === '1' || s === '1.0' || s === '1.00' || s === '1.1' || s === '1.10' || s === '1.35' || s === '2' || s === '2.0' || s === '2.00') {
          s = '1.75';
          localStorage.setItem('jt_font_scale', '1.75');
        }
        var val = parseFloat(s);
        if (!isNaN(val)) {
          if (val > 2.5) {
            val = 2.5;
            localStorage.setItem('jt_font_scale', '2.50');
          }
          if (val >= 0.75 && val <= 2.5) {
            document.documentElement.style.setProperty('--font-scale', val);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-mode="practice">

  <!-- Main Container -->
  <main class="main-container">

    <!-- ============================================================
         CONTENT AREA (Question / Formulas / All-Questions views)
         Comes FIRST so question is at the very top of the page
    ============================================================ -->

    <!-- MODE 1: PRACTICE MODE (Question FIRST at Top) -->
    <section id="practice-view" class="view-section active">
      
      <!-- Question Card -->
      <div class="quiz-card">
        <!-- Question Body -->
        <div class="question-content">
          <div class="question-header-bar">
            <!-- Top Left: Subject Selector Dropdown Badge -->
            <div class="question-number-badge subject-selector-badge" id="card-subject-badge" onclick="promptSubjectSelection()" title="Click to change subject" role="button" tabindex="0">
              <div class="badge-subject-select-wrapper">
                <span id="subject-badge-name">Fluid Mechanics</span>
                <i class="fa-solid fa-chevron-down badge-subject-chevron"></i>
                <label for="card-subject-selector" class="sr-only">Subject:</label>
                <select id="card-subject-selector" style="display: none;" onchange="switchSubject(this.value)" title="Change Subject" tabindex="-1" aria-hidden="true">
                  <option value="basic_electronics">Basic Electronics</option>
                  <option value="fluid_mechanics" selected>Fluid Mechanics</option>
                  <option value="deformable_bodies">Mechanics of Deformable Bodies</option>
                  <option value="heat_transfer">Heat Transfer</option>
                  <option value="ac_dc_machinery">AC/DC Machinery</option>
                </select>
              </div>
            </div>

            <!-- Top Right: Problem Number Indicator Badge -->
            <div class="question-number-badge problem-number-badge" id="card-problem-badge" onclick="promptJumpToQuestion()" title="Jump to Problem Number" role="button" tabindex="0">
              <span class="badge-problem-info">Problem <span id="q-current-num">1</span> of <span id="q-total-num">127</span></span>
            </div>
          </div>
          <h2 class="question-text" id="q-text">Loading question...</h2>
          
          <!-- Optional Question Diagram Image Container -->
          <div id="q-image-container" class="question-image-container" style="display: none;"></div>
          
          <!-- Choices / Options list -->
          <div class="options-grid" id="q-options-container">
            <!-- Options dynamically rendered in JS -->
          </div>
        </div>

        <!-- Previous & Next Navigation Buttons (Just below the question!) -->
        <div class="inline-nav-container">
          <button class="quiz-nav-btn" onclick="prevQuestion()" id="btn-prev-inline">
            <i class="fa-solid fa-arrow-left"></i> Previous
          </button>
          <button class="quiz-nav-btn primary" onclick="nextQuestion()" id="btn-next-inline">
            Next <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Toggle Button for Question Hints & Solution -->
      <div class="notes-toggle-wrapper">
        <button class="notes-toggle-btn" id="toggle-notes-btn" onclick="toggleNotesSection()">
          <i class="fa-solid fa-lightbulb"></i> Show Solution & Hint <span id="notes-count-badge" style="display: none;">0</span>
          <i class="fa-solid fa-chevron-down" id="toggle-notes-chevron"></i>
        </button>
      </div>

      <!-- Collapsible Per-Question Notes & Solution Section -->
      <!-- Interactive Notes & Hints Drawer -->
      <div id="notes-section-container" class="interactive-drawer hidden">
        <!-- Concept Hint Box -->
        <div class="explanation-box" id="q-explanation-box">
          <div class="explanation-box-top-row">
            <div class="explanation-header" id="q-explanation-header"><i class="fa-solid fa-lightbulb"></i> Hint & Concept:</div>
            <button class="hide-hints-top-btn" onclick="hideNotesSection()" title="Hide Hints (Press Space)">
              <i class="fa-solid fa-xmark"></i> Hide Hints
            </button>
          </div>
          <div class="explanation-text" id="q-explanation-text"></div>
        </div>

        <!-- Hidden dummy elements to maintain JS compatibility -->
        <div style="display: none;" aria-hidden="true">
          <span id="notes-q-num"></span>
          <div id="live-notes-container"></div>
        </div>
      </div>
    </section>

    <!-- MODE 2: ALL QUESTIONS / FLASHCARDS VIEW -->
    <section id="all-view" class="view-section">
      <div class="filter-controls-card">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-all-input" placeholder="Search by question keyword, concept, or option..." oninput="filterAllQuestions()">
        </div>
        <div class="filters-row">
          <select id="filter-status-select" onchange="filterAllQuestions()">
            <option value="all">All Statuses</option>
            <option value="weak">⚠️ Class Weak Questions</option>
                        <option value="correct">✓ Correctly Answered</option>
            <option value="incorrect">✗ Incorrectly Answered</option>
          </select>
          <span class="search-count-label" id="search-count-badge">Showing questions</span>
        </div>
      </div>

      <div class="questions-list-container" id="all-questions-list">
        <!-- Rendered in JS -->
      </div>
    </section>

    

    <!-- ============================================================
         BOTTOM PANEL: Unified Stats Bar & Clean App Toolbar
         Sits BELOW all content — sleek, unified, uncluttered
    ============================================================ -->
    <div class="bottom-panel">

      <!-- Hidden compatibility stats elements for JS -->
      <span id="stat-total" style="display: none;">0</span>
      <span id="stat-accuracy" style="display: none;">0%</span>

      <!-- App Header: Brand, Mode Switcher, Subject Selector, Utility Actions -->
      <header class="app-header">
        <div class="header-container">
          
          <!-- Left: Brand Trio & Title -->
          <div class="brand-group">
            <a href="https://jeycubb.github.io/TIP-Grade-Calculator/#calc" target="_self" class="brand-nav-btn" id="btn-header-calc" onclick="try{localStorage.setItem('tip_gc_active_view','calc');}catch(e){}" title="Open TIP Grade Calculator (GWA & Target Calculator)" aria-label="Open TIP Grade Calculator">
              <span class="brand-emoji">
                <svg class="brand-calc-emoji" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="calc-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#475569"/>
                      <stop offset="30%" stop-color="#334155"/>
                      <stop offset="100%" stop-color="#1e293b"/>
                    </linearGradient>
                    <linearGradient id="calc-lcd-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#090d16"/>
                      <stop offset="100%" stop-color="#111827"/>
                    </linearGradient>
                    <linearGradient id="calc-bevel-gloss" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
                      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
                      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="calc-btn-accent" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#fb923c"/>
                      <stop offset="100%" stop-color="#ea580c"/>
                    </linearGradient>
                    <linearGradient id="calc-btn-fn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#94a3b8"/>
                      <stop offset="100%" stop-color="#64748b"/>
                    </linearGradient>
                    <linearGradient id="calc-btn-num-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#ffffff"/>
                      <stop offset="100%" stop-color="#cbd5e1"/>
                    </linearGradient>
                  </defs>
                  <rect x="5" y="3" width="26" height="30" rx="5.5" fill="url(#calc-body-grad)" stroke="#64748b" stroke-width="0.75"/>
                  <rect x="5.5" y="3.5" width="25" height="12" rx="4.8" fill="url(#calc-bevel-gloss)"/>
                  <rect x="7.5" y="5.5" width="21" height="7.5" rx="2" fill="url(#calc-lcd-grad)" stroke="#090d16" stroke-width="0.75"/>
                  <rect x="23.5" y="7.8" width="3.2" height="3" rx="0.5" fill="#38bdf8"/>
                  <text x="21" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="5" font-weight="800" fill="#38bdf8" text-anchor="end">12</text>
                  <rect x="8" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
                  <rect x="13.2" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
                  <rect x="18.5" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
                  <rect x="23.8" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
                  <rect x="8" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="13.2" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="18.5" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="23.8" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
                  <rect x="8" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="13.2" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="18.5" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="23.8" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
                  <rect x="8" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="13.2" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="18.5" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
                  <rect x="23.8" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
                </svg>
              </span>
            </a>
            <a href="https://jeycubb.github.io/JeyCub-terms-reviewer/" target="_self" class="brand-nav-btn active" id="btn-header-reviewer" title="JeyCub Terms Reviewer (Current App)" aria-label="JeyCub Terms Reviewer">
              <span class="brand-emoji">📖</span>
            </a>
            <a href="https://jeycubb.github.io/scheduler/" target="_self" class="brand-nav-btn" id="btn-header-sched" title="Open Schedule Creator" aria-label="Open Schedule Creator">
              <span class="brand-emoji">📅</span>
            </a>
            <h1 class="sr-only">JeyCub Terms Reviewer</h1>
          </div>

          <!-- Practice Score Badge (Live Correct/Wrong Counters) -->
          <div class="quiz-score-badge">
            <span class="score-tag correct" title="Correct Answers"><i class="fa-solid fa-check"></i> <span id="stat-correct">0</span> Correct</span>
            <span class="score-tag incorrect" title="Incorrect Answers"><i class="fa-solid fa-xmark"></i> <span id="stat-incorrect">0</span> Wrong</span>
          </div>

          <!-- Center: Review Modes Toggle -->
          <nav class="mode-nav">
            <button class="nav-btn active" id="btn-practice-mode" onclick="switchMode('practice')">
              <i class="fa-solid fa-graduation-cap"></i> Practice
            </button>
            <button class="nav-btn" id="btn-all-mode" onclick="switchMode('all')">
              <i class="fa-solid fa-list-check"></i> All Questions
            </button>
          </nav>

          <!-- Right: All 6 Action Buttons in a Single Contiguous Row -->
          <div class="header-action-buttons-group">
            <!-- 1. Listen / Narration Button -->
            <button type="button" class="control-single-btn audio-single-btn" id="q-audio-btn" onclick="toggleNarration()" title="Narrate question &amp; choices [Press M]" aria-label="Narrate question and choices">
              <i class="fa-solid fa-volume-high" id="q-audio-icon"></i>
              <span id="q-audio-label" style="display: none;">Listen</span>
            </button>

            <!-- 2. Reset Current Subject Button -->
            <button class="control-single-btn reset-single-btn" id="btn-quiz-reset" onclick="resetAllSubjectAnswers()" title="Reset All Answers (Keeps Weak Questions Memory)" aria-label="Reset All Answers">
              <i class="fa-solid fa-rotate-left"></i>
              <span id="reset-subject-name" style="display: none;"></span>
            </button>

            <!-- 3. Practice Pool Filter -->
            <button type="button" class="control-single-btn pool-single-btn-wrapper" id="pool-single-wrapper" onclick="promptPoolFilterSelection()" title="Question Pool: All Questions" aria-label="Question Pool">
              <i class="fa-solid fa-layer-group"></i>
              <select id="practice-filter-select" style="display: none;" onchange="changePracticeFilter(this.value)" title="Question Pool" tabindex="-1" aria-hidden="true">
                <option value="all">📚 All Questions</option>
                <option value="weak">⚠️  Weak Questions</option>
              </select>
            </button>

            <!-- 4. Random Toggle Button -->
            <button class="control-single-btn random-single-btn" id="btn-toggle-random" onclick="toggleRandomMode()" title="Random Order: OFF (Click to turn ON)" aria-label="Toggle Random Order">
              <i class="fa-solid fa-shuffle"></i>
            </button>

            <!-- 5. PDF Export Button (Visible only in All Questions mode) -->
            <button class="control-single-btn action-single-btn pdf-btn" id="btn-pdf-export" title="Download Subject as Printable PDF (Randomized, 2 Columns, 0.05 margin)" onclick="downloadSubjectPdf()" aria-label="Download Printable PDF">
              <i class="fa-solid fa-file-pdf"></i>
            </button>

            <!-- 6. Dark/Light Mode Toggle -->
            <button class="control-single-btn action-single-btn theme-toggle" title="Toggle Dark/Light Mode" onclick="toggleTheme()" aria-label="Toggle Dark/Light Mode">
              <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
          </div>

        </div>
      </header>

    </div><!-- /.bottom-panel -->

  </main>
  <!-- Floating Font Size Indicator Toast (Tap to reset to 175%) -->
  <!-- Floating Font Size Control Toast (Accessible Text Sizing) -->
  <div id="font-scale-toast" class="font-scale-toast" title="Text Size Controls">
    <button type="button" class="toast-adjust-btn" onclick="adjustFontSize(-0.05); event.stopPropagation();" title="Smaller (A-)"><i class="fa-solid fa-minus"></i></button>
    <div class="toast-center-content" onclick="resetFontScale()" title="Tap to reset to 175%">
      <i class="fa-solid fa-text-height"></i> Text: <span id="font-scale-val">175%</span>
    </div>
    <button type="button" class="toast-adjust-btn" onclick="adjustFontSize(0.05); event.stopPropagation();" title="Larger (A+)"><i class="fa-solid fa-plus"></i></button>
  </div>


  <script src="questions.js?v=115.0"></script>
  <script src="app.js?v=135.0"></script>
  <!-- App Confirmation & Alert Modal (TIP Grade Calculator Design) -->
  <div id="app-confirm-modal" class="profile-modal-overlay" style="display: none;">
    <div class="profile-modal-dialog">
      <div class="profile-modal-header">
        <div class="profile-modal-title-wrap">
          <div class="profile-modal-avatar-icon" id="app-confirm-modal-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div>
            <h2 class="profile-modal-title" id="app-confirm-modal-title">Confirm Action</h2>
            <div class="profile-modal-subtitle" id="app-confirm-modal-subtitle" style="display: none;"></div>
          </div>
        </div>
        <button class="profile-modal-close-btn" id="app-confirm-modal-close" title="Close dialog">&times;</button>
      </div>

      <div class="profile-modal-body" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.35rem;">
        <div id="app-confirm-modal-content"></div>

        <div id="app-confirm-modal-actions" style="display: flex; gap: 0.55rem; margin-top: 0.35rem;">
          <button class="btn-modal btn-modal-cancel" id="app-confirm-modal-cancel">
            Cancel
          </button>
          <button class="btn-modal btn-modal-primary" id="app-confirm-modal-confirm">
            Confirm
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
